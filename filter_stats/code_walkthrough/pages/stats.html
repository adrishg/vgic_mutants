html, body { height: 100%; }
body {

}

/* ---------------------------------------------------------------- panes */
.panes { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 12px; }

}

.code-head {

}

.badge {

.badge.return { color: var(--t-ret); border-color: currentColor; }
.badge.note { color: var(--t-changed); border-color: currentColor; }
.badge.warn { color: var(--t-warn); border-color: currentColor; }
.note { font-size: 14.5px; line-height: 1.55; max-width: 68ch; }

h2 { margin: 0; font: 600 16px/1.3 var(--sans); text-wrap: balance; }

.muted { color: var(--muted); font-size: 13px; max-width: 68ch; }
.vars { display: flex; flex-direction: column; gap: 12px; }

}
.t-new { color: var(--t-new); } .t-changed { color: var(--t-changed); } .t-same { color: var(--t-same); }

.valwrap { overflow-x: auto; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--rule); }

.vl { display: block; padding: 0 12px; white-space: pre; }
.vl.d { background: var(--diff); box-shadow: inset 3px 0 0 var(--hl-bar); }
.labcap { font-size: 12px; color: var(--muted); margin-top: 2px; }
details.allvars { border-top: 1px solid var(--rule); padding-top: 10px; }
details.allvars summary { cursor: pointer; font-size: 13px; color: var(--muted); }
details.allvars .vars { margin-top: 10px; }
.empty { color: var(--muted); font-size: 13.5px; font-style: italic; }
.intro ul, .intro ol { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 3px; max-width: 68ch; }
.intro p { margin: 0; max-width: 68ch; }
.intro { display: flex; flex-direction: column; gap: 12px; }
table.csv { border-collapse: collapse; font: 12px/1.4 var(--mono); font-variant-numeric: tabular-nums; }
table.csv th, table.csv td { padding: 3px 10px; text-align: right; border-bottom: 1px solid var(--rule); white-space: nowrap; }
table.csv th { font-weight: 600; color: var(--muted); position: sticky; top: 0; background: var(--surface-2); }
table.csv td:nth-child(-n+3), table.csv th:nth-child(-n+3) { text-align: left; }
table.csv tr.r0 td { color: var(--faint); }
.tablewrap { overflow: auto; max-height: 22rem; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface-2); }
.hintrow { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; min-height: 1.6em; align-items: baseline; }
.upnext { color: var(--muted); }
.upnext b { color: var(--ink); font-weight: 600; }
.upnext code { font: 0.92em var(--mono); color: var(--ink); background: var(--surface); border: 1px solid var(--rule); padding: 0 4px; border-radius: 3px; }
.toast { color: var(--t-warn); }
.home { font-size: 13px; color: var(--accent); text-decoration: none; }
.home:hover { text-decoration: underline; }
.badge.once { color: var(--t-same); border-color: currentColor; }
.badge.err { color: var(--t-warn); border-color: currentColor; }
.pipe { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 6px; align-items: baseline; }
.pipe .on { color: var(--ink); font-weight: 600; }
@media (prefers-reduced-motion: no-preference) { .ln, .vl { transition: background-color 120ms ease; } }

<script id="trace-data" type="application/json">{"file": "stats.py", "source": ["<span class=\"com\">#!/usr/bin/env python3<\/span>", "<span class=\"doc\">&quot;&quot;&quot;The statistics step: each condition against the control, for every measure and recycle.<\/span>", "<span class=\"doc\"><\/span>", "<span class=\"doc\">Run:  python -B pipeline/stats.py --config datasets/&lt;dataset&gt;/&lt;dataset&gt;.toml<\/span>", "<span class=\"doc\">It reads step 2&#x27;s results (&lt;output&gt;/regions/) and writes &lt;output&gt;/stats/. Decisions: D-007 (any number of<\/span>", "<span class=\"doc\">conditions against one control, two-sided), D-066 (one family), D-069 (REML), D-070 (spread against each<\/span>", "<span class=\"doc\">network&#x27;s own average), D-074 (spread and offset, not deviation), D-075 (no small-group correction),<\/span>", "<span class=\"doc\">D-076 (the 5% split between measures, Dunnett within each), D-077 (one mixed model, one value per group),<\/span>", "<span class=\"doc\">D-078 (no minimum group size).<\/span>", "<span class=\"doc\"><\/span>", "<span class=\"doc\">The measures: spread and offset of each region in the config (spread only where step 2 has no offset,<\/span>", "<span class=\"doc\">for example without a structure); without [regions], step 1&#x27;s spread and offset. Recycle 0 is not analysed.<\/span>", "<span class=\"doc\"><\/span>", "<span class=\"doc\">1. One value per group (one condition, one network, one recycle). Spread: the root-mean-square of the<\/span>", "<span class=\"doc\">   group&#x27;s model spreads, that is how scattered the group&#x27;s models are around their average model; a group<\/span>", "<span class=\"doc\">   of one model has no spread. Offset: the distance from the group&#x27;s average model to the structure.<\/span>", "<span class=\"doc\">   Every group is used wherever its value exists.<\/span>", "<span class=\"doc\">2. One mixed model per measure, fitted by REML:<\/span>", "<span class=\"doc\">       log(value) ~ condition × recycle + network + (1 | condition:network)<\/span>", "<span class=\"doc\">   - condition × recycle: each condition&#x27;s own mean at each recycle (no shape assumed across recycles);<\/span>", "<span class=\"doc\">   - network: every condition was run through the same networks, so each comparison is made within<\/span>", "<span class=\"doc\">     network, as in a paired design;<\/span>", "<span class=\"doc\">   - (1 | condition:network): a pair&#x27;s groups at different recycles come from the same seeds, so they are<\/span>", "<span class=\"doc\">     not independent; the random intercept counts each pair once. The pairs are the units, and the<\/span>", "<span class=\"doc\">     networks are each condition&#x27;s repeats.<\/span>", "<span class=\"doc\">3. Each condition other than the control is compared with the control at each recycle: the difference of<\/span>", "<span class=\"doc\">   their log means, reported as a ratio of geometric means. Its standard error comes from the fixed<\/span>", "<span class=\"doc\">   effects&#x27; covariance (X&#x27; V^-1 X)^-1 with the fitted variances.<\/span>", "<span class=\"doc\">4. Degrees of freedom: pairs − (conditions + networks − 1), i.e. (conditions − 1) × (networks − 1) for<\/span>", "<span class=\"doc\">   complete data. With fewer than 2 conditions or 2 networks there is nothing to test against.<\/span>", "<span class=\"doc\">5. Multiple testing: the 5% is split evenly between the measures (Bonferroni); within a measure, its<\/span>", "<span class=\"doc\">   comparisons get one two-sided Dunnett cutoff from the multivariate t with their correlations. Adjusted<\/span>", "<span class=\"doc\">   p-values and simultaneous 95% intervals use the same cutoff.<\/span>", "<span class=\"doc\"><\/span>", "<span class=\"doc\">Caveats, reported with the results: the log values are about normal with one noise level per measure; all<\/span>", "<span class=\"doc\">recycles of a pair are equally alike; groups count equally whatever their size; each average model is<\/span>", "<span class=\"doc\">estimated from its own group&#x27;s models, so spread reads slightly low and offset slightly high in small<\/span>", "<span class=\"doc\">groups (not corrected).<\/span>", "<span class=\"doc\"><\/span>", "<span class=\"doc\">Writes &lt;output&gt;/stats/: comparisons.csv (one row per measure × condition × recycle), models.json (per<\/span>", "<span class=\"doc\">measure: groups, pairs, degrees of freedom, variances, cutoff; and the counts a methods text needs),<\/span>", "<span class=\"doc\">manifest.json (written last) and stats.log.<\/span>", "<span class=\"doc\">&quot;&quot;&quot;<\/span>", "<span class=\"kw\">from<\/span> __future__ <span class=\"kw\">import<\/span> annotations", "", "<span class=\"kw\">import<\/span> argparse", "<span class=\"kw\">import<\/span> hashlib", "<span class=\"kw\">import<\/span> json", "<span class=\"kw\">import<\/span> sys", "<span class=\"kw\">import<\/span> tomllib", "<span class=\"kw\">from<\/span> datetime <span class=\"kw\">import<\/span> datetime, timezone", "<span class=\"kw\">from<\/span> pathlib <span class=\"kw\">import<\/span> Path", "", "<span class=\"kw\">import<\/span> numpy <span class=\"kw\">as<\/span> np", "<span class=\"kw\">import<\/span> pandas <span class=\"kw\">as<\/span> pd", "<span class=\"kw\">from<\/span> scipy.optimize <span class=\"kw\">import<\/span> brentq", "<span class=\"kw\">from<\/span> scipy.stats <span class=\"kw\">import<\/span> multivariate_t", "<span class=\"kw\">from<\/span> scipy.stats <span class=\"kw\">import<\/span> t <span class=\"kw\">as<\/span> t_dist", "<span class=\"kw\">from<\/span> statsmodels.regression.mixed_linear_model <span class=\"kw\">import<\/span> MixedLM", "", "<span class=\"kw\">from<\/span> build_dv <span class=\"kw\">import<\/span> STEP1_ERRORS, Log, _git, _versions, _write_json, file_digest", "<span class=\"kw\">from<\/span> config <span class=\"kw\">import<\/span> Config, load_config", "", "HERE = Path(__file__).resolve().parent", "ALPHA = <span class=\"num\">0.05<\/span>", "SEED = <span class=\"num\">0<\/span>                          <span class=\"com\"># the multivariate t&#x27;s integration is randomised; a fixed seed repeats it<\/span>", "STATS_FILES = (<span class=\"str\">&quot;manifest.json&quot;<\/span>, <span class=\"str\">&quot;comparisons.csv&quot;<\/span>, <span class=\"str\">&quot;models.json&quot;<\/span>, <span class=\"str\">&quot;stats.log&quot;<\/span>)", "MODEL = <span class=\"str\">&quot;log(value) ~ condition * recycle + network + (1 | condition:network)&quot;<\/span>", "", "", "<span class=\"kw\">class<\/span> <span class=\"fn\">StatsInputError<\/span>(<span class=\"bi\">Exception<\/span>):", "    <span class=\"doc\">&quot;&quot;&quot;Step 2&#x27;s results are missing, or out of date with the config, step 1 or the screen.&quot;&quot;&quot;<\/span>", "", "", "<span class=\"kw\">class<\/span> <span class=\"fn\">StatsDesignError<\/span>(<span class=\"bi\">Exception<\/span>):", "    <span class=\"doc\">&quot;&quot;&quot;The design leaves nothing to test against (fewer than 2 conditions or networks, no degrees of freedom).&quot;&quot;&quot;<\/span>", "", "", "STEP_ERRORS = (StatsInputError, StatsDesignError, *STEP1_ERRORS)", "", "", "<span class=\"com\"># =========================================================================== one value per group<\/span>", "", "<span class=\"kw\">def<\/span> <span class=\"fn\">group_values<\/span>(dv: pd.DataFrame, measures: <span class=\"bi\">list<\/span>) -&gt; pd.DataFrame:", "    <span class=\"doc\">&quot;&quot;&quot;One row per group (condition, network, recycle &gt;= 1): pair, number of models and each measure&#x27;s value.&quot;&quot;&quot;<\/span>", "    d = dv[dv.recycle &gt;= <span class=\"num\">1<\/span>]", "    rows = []", "    <span class=\"kw\">for<\/span> (cond, net, rec), g <span class=\"kw\">in<\/span> d.groupby([<span class=\"str\">&quot;condition&quot;<\/span>, <span class=\"str\">&quot;model&quot;<\/span>, <span class=\"str\">&quot;recycle&quot;<\/span>], sort=<span class=\"kw\">True<\/span>):", "        row = {<span class=\"str\">&quot;condition&quot;<\/span>: cond, <span class=\"str\">&quot;network&quot;<\/span>: net, <span class=\"str\">&quot;recycle&quot;<\/span>: <span class=\"bi\">int<\/span>(rec), <span class=\"str\">&quot;pair&quot;<\/span>: <span class=\"str\">f&quot;{cond}:{net}&quot;<\/span>, <span class=\"str\">&quot;n&quot;<\/span>: <span class=\"bi\">len<\/span>(g)}", "        <span class=\"kw\">for<\/span> m <span class=\"kw\">in<\/span> measures:", "            x = g[m].to_numpy(dtype=<span class=\"bi\">float<\/span>)", "            <span class=\"kw\">if<\/span> m.startswith(<span class=\"str\">&quot;offset&quot;<\/span>):", "                row[m] = <span class=\"bi\">float<\/span>(x[<span class=\"num\">0<\/span>])                                        <span class=\"com\"># one value for the whole group<\/span>", "            <span class=\"kw\">else<\/span>:", "                row[m] = <span class=\"bi\">float<\/span>(np.sqrt(np.mean(x ** <span class=\"num\">2<\/span>))) <span class=\"kw\">if<\/span> <span class=\"bi\">len<\/span>(g) &gt;= <span class=\"num\">2<\/span> <span class=\"kw\">else<\/span> np.nan", "        rows.append(row)", "    <span class=\"kw\">return<\/span> pd.DataFrame(rows, columns=[<span class=\"str\">&quot;condition&quot;<\/span>, <span class=\"str\">&quot;network&quot;<\/span>, <span class=\"str\">&quot;recycle&quot;<\/span>, <span class=\"str\">&quot;pair&quot;<\/span>, <span class=\"str\">&quot;n&quot;<\/span>, *measures])", "", "", "<span class=\"com\"># =========================================================================== the mixed model<\/span>", "", "<span class=\"kw\">def<\/span> <span class=\"fn\">fe_covariance<\/span>(X: np.ndarray, pairs: np.ndarray, var_pair: <span class=\"bi\">float<\/span>, var_noise: <span class=\"bi\">float<\/span>) -&gt; np.ndarray:", "    <span class=\"doc\">&quot;&quot;&quot;(X&#x27; V^-1 X)^-1, V = var_noise·I + var_pair within each pair: the fixed effects&#x27; covariance given the<\/span>", "<span class=\"doc\">    fitted variances. For a pair of k rows, V^-1 = (I − var_pair / (var_noise + k·var_pair) · 11&#x27;) / var_noise.&quot;&quot;&quot;<\/span>", "    A = np.zeros((X.shape[<span class=\"num\">1<\/span>], X.shape[<span class=\"num\">1<\/span>]))", "    <span class=\"kw\">for<\/span> p <span class=\"kw\">in<\/span> pd.unique(pairs):", "        Xi = X[pairs == p]", "        s = Xi.<span class=\"bi\">sum<\/span>(axis=<span class=\"num\">0<\/span>)", "        A += (Xi.T @ Xi - var_pair / (var_noise + <span class=\"bi\">len<\/span>(Xi) * var_pair) * np.outer(s, s)) / var_noise", "    <span class=\"kw\">return<\/span> np.linalg.inv(A)", "", "", "<span class=\"kw\">def<\/span> <span class=\"fn\">fit_measure<\/span>(groups: pd.DataFrame, measure: <span class=\"bi\">str<\/span>, control: <span class=\"bi\">str<\/span>, conditions=<span class=\"kw\">None<\/span>) -&gt; <span class=\"bi\">dict<\/span>:", "    <span class=\"doc\">&quot;&quot;&quot;Fit one measure (module docstring, items 2-4) and compare each condition with the control.&quot;&quot;&quot;<\/span>", "    d = groups[np.isfinite(groups[measure]) &amp; (groups[measure] &gt; <span class=\"num\">0<\/span>)].reset_index(drop=<span class=\"kw\">True<\/span>)", "    present = <span class=\"bi\">list<\/span>(<span class=\"bi\">dict<\/span>.fromkeys(d.condition))", "    order = [c <span class=\"kw\">for<\/span> c <span class=\"kw\">in<\/span> (conditions <span class=\"kw\">or<\/span> present) <span class=\"kw\">if<\/span> c <span class=\"kw\">in<\/span> present]", "    nets = <span class=\"bi\">sorted<\/span>(d.network.unique())", "    n_pairs, n_conds = d.pair.nunique(), <span class=\"bi\">len<\/span>(present)", "    df = n_pairs - (n_conds + <span class=\"bi\">len<\/span>(nets) - <span class=\"num\">1<\/span>)", "    <span class=\"kw\">if<\/span> control <span class=\"kw\">not<\/span> <span class=\"kw\">in<\/span> present <span class=\"kw\">or<\/span> n_conds &lt; <span class=\"num\">2<\/span> <span class=\"kw\">or<\/span> <span class=\"bi\">len<\/span>(nets) &lt; <span class=\"num\">2<\/span> <span class=\"kw\">or<\/span> df &lt; <span class=\"num\">1<\/span>:", "        <span class=\"kw\">raise<\/span> StatsDesignError(", "            <span class=\"str\">f&quot;{measure}: nothing to test against: the comparisons need the control and at least one other condition, &quot;<\/span>", "            <span class=\"str\">f&quot;each run through at least 2 networks ({n_conds} condition(s), {len(nets)} network(s), {df} degrees of &quot;<\/span>", "            <span class=\"str\">f&quot;freedom; control {control!r} {&#x27;present&#x27; if control in present else &#x27;missing&#x27;})&quot;<\/span>)", "", "    cells = <span class=\"bi\">sorted<\/span>(<span class=\"bi\">set<\/span>(<span class=\"bi\">zip<\/span>(d.condition, d.recycle)))                  <span class=\"com\"># one mean per condition × recycle ...<\/span>", "    col = {cell: j <span class=\"kw\">for<\/span> j, cell <span class=\"kw\">in<\/span> <span class=\"bi\">enumerate<\/span>(cells)}", "    X = np.zeros((<span class=\"bi\">len<\/span>(d), <span class=\"bi\">len<\/span>(cells) + <span class=\"bi\">len<\/span>(nets) - <span class=\"num\">1<\/span>))", "    X[np.arange(<span class=\"bi\">len<\/span>(d)), [col[k] <span class=\"kw\">for<\/span> k <span class=\"kw\">in<\/span> <span class=\"bi\">zip<\/span>(d.condition, d.recycle)]] = <span class=\"num\">1.0<\/span>", "    <span class=\"kw\">for<\/span> k, net <span class=\"kw\">in<\/span> <span class=\"bi\">enumerate<\/span>(nets[<span class=\"num\">1<\/span>:]):                                <span class=\"com\"># ... plus each network&#x27;s level<\/span>", "        X[:, <span class=\"bi\">len<\/span>(cells) + k] = (d.network.to_numpy() == net)", "    y = np.log(d[measure].to_numpy(dtype=<span class=\"bi\">float<\/span>))", "    pairs = d.pair.to_numpy()", "    fit = MixedLM(y, X, groups=pairs).fit(reml=<span class=\"kw\">True<\/span>)", "    beta = np.asarray(fit.fe_params)", "    var_pair, var_noise = <span class=\"bi\">float<\/span>(np.asarray(fit.cov_re)[<span class=\"num\">0<\/span>, <span class=\"num\">0<\/span>]), <span class=\"bi\">float<\/span>(fit.scale)", "    V = fe_covariance(X, pairs, var_pair, var_noise)", "", "    rows, L = [], []", "    <span class=\"kw\">for<\/span> cond <span class=\"kw\">in<\/span> [c <span class=\"kw\">for<\/span> c <span class=\"kw\">in<\/span> order <span class=\"kw\">if<\/span> c != control]:", "        <span class=\"kw\">for<\/span> rec <span class=\"kw\">in<\/span> <span class=\"bi\">sorted<\/span>(d.recycle.unique()):", "            <span class=\"kw\">if<\/span> (cond, rec) <span class=\"kw\">in<\/span> col <span class=\"kw\">and<\/span> (control, rec) <span class=\"kw\">in<\/span> col:", "                ell = np.zeros(X.shape[<span class=\"num\">1<\/span>])", "                ell[col[(cond, rec)]], ell[col[(control, rec)]] = <span class=\"num\">1.0<\/span>, -<span class=\"num\">1.0<\/span>", "                est, se = <span class=\"bi\">float<\/span>(ell @ beta), <span class=\"bi\">float<\/span>(np.sqrt(ell @ V @ ell))", "                rows.append({<span class=\"str\">&quot;condition&quot;<\/span>: cond, <span class=\"str\">&quot;recycle&quot;<\/span>: <span class=\"bi\">int<\/span>(rec), <span class=\"str\">&quot;log_ratio&quot;<\/span>: est, <span class=\"str\">&quot;ratio&quot;<\/span>: np.exp(est),", "                             <span class=\"str\">&quot;SE&quot;<\/span>: se, <span class=\"str\">&quot;t&quot;<\/span>: est / se})", "                L.append(ell)", "            <span class=\"kw\">else<\/span>:                                                     <span class=\"com\"># a condition with no group here: not computable<\/span>", "                rows.append({<span class=\"str\">&quot;condition&quot;<\/span>: cond, <span class=\"str\">&quot;recycle&quot;<\/span>: <span class=\"bi\">int<\/span>(rec), <span class=\"str\">&quot;log_ratio&quot;<\/span>: np.nan, <span class=\"str\">&quot;ratio&quot;<\/span>: np.nan,", "                             <span class=\"str\">&quot;SE&quot;<\/span>: np.nan, <span class=\"str\">&quot;t&quot;<\/span>: np.nan})", "    comparisons = pd.DataFrame(rows, columns=[<span class=\"str\">&quot;condition&quot;<\/span>, <span class=\"str\">&quot;recycle&quot;<\/span>, <span class=\"str\">&quot;log_ratio&quot;<\/span>, <span class=\"str\">&quot;ratio&quot;<\/span>, <span class=\"str\">&quot;SE&quot;<\/span>, <span class=\"str\">&quot;t&quot;<\/span>])", "    <span class=\"kw\">if<\/span> L:", "        Lk = np.array(L)", "        C = Lk @ V @ Lk.T", "        sd = np.sqrt(np.diag(C))", "        R = C / np.outer(sd, sd)", "    <span class=\"kw\">else<\/span>:", "        R = np.zeros((<span class=\"num\">0<\/span>, <span class=\"num\">0<\/span>))", "    info = {<span class=\"str\">&quot;groups&quot;<\/span>: <span class=\"bi\">int<\/span>(<span class=\"bi\">len<\/span>(d)), <span class=\"str\">&quot;groups_without_value&quot;<\/span>: <span class=\"bi\">int<\/span>(<span class=\"bi\">len<\/span>(groups) - <span class=\"bi\">len<\/span>(d)), <span class=\"str\">&quot;pairs&quot;<\/span>: <span class=\"bi\">int<\/span>(n_pairs),", "            <span class=\"str\">&quot;conditions&quot;<\/span>: <span class=\"bi\">int<\/span>(n_conds), <span class=\"str\">&quot;networks&quot;<\/span>: <span class=\"bi\">int<\/span>(<span class=\"bi\">len<\/span>(nets)), <span class=\"str\">&quot;var_pair&quot;<\/span>: var_pair, <span class=\"str\">&quot;var_noise&quot;<\/span>: var_noise,", "            <span class=\"str\">&quot;converged&quot;<\/span>: <span class=\"bi\">bool<\/span>(fit.converged)}", "    <span class=\"kw\">return<\/span> {<span class=\"str\">&quot;comparisons&quot;<\/span>: comparisons, <span class=\"str\">&quot;R&quot;<\/span>: R, <span class=\"str\">&quot;df&quot;<\/span>: <span class=\"bi\">int<\/span>(df), <span class=\"str\">&quot;info&quot;<\/span>: info}", "", "", "<span class=\"com\"># =========================================================================== the cutoff<\/span>", "", "<span class=\"kw\">def<\/span> <span class=\"fn\">block_prob<\/span>(c: <span class=\"bi\">float<\/span>, R: np.ndarray, df: <span class=\"bi\">float<\/span>) -&gt; <span class=\"bi\">float<\/span>:", "    <span class=\"doc\">&quot;&quot;&quot;P(every |T_i| &lt;= c) for T multivariate t with correlations R and df degrees of freedom.&quot;&quot;&quot;<\/span>", "    k = <span class=\"bi\">len<\/span>(R)", "    <span class=\"kw\">if<\/span> k == <span class=\"num\">0<\/span>:", "        <span class=\"kw\">return<\/span> <span class=\"num\">1.0<\/span>", "    <span class=\"kw\">if<\/span> k == <span class=\"num\">1<\/span>:", "        <span class=\"kw\">return<\/span> <span class=\"bi\">float<\/span>(<span class=\"num\">1<\/span> - <span class=\"num\">2<\/span> * t_dist.sf(c, df))", "    mvt = multivariate_t(loc=np.zeros(k), shape=R, df=df, allow_singular=<span class=\"kw\">True<\/span>)", "    <span class=\"kw\">return<\/span> <span class=\"bi\">float<\/span>(mvt.cdf(np.full(k, c), lower_limit=np.full(k, -c), random_state=SEED))", "", "", "<span class=\"kw\">def<\/span> <span class=\"fn\">cutoff<\/span>(R: np.ndarray, df: <span class=\"bi\">float<\/span>, alpha: <span class=\"bi\">float<\/span>) -&gt; <span class=\"bi\">float<\/span>:", "    <span class=\"doc\">&quot;&quot;&quot;Dunnett&#x27;s two-sided cutoff: the c at which P(every |T| &lt;= c) = 1 − alpha.&quot;&quot;&quot;<\/span>", "    <span class=\"kw\">if<\/span> <span class=\"bi\">len<\/span>(R) == <span class=\"num\">0<\/span>:", "        <span class=\"kw\">return<\/span> np.nan", "    target, hi = <span class=\"num\">1<\/span> - alpha, <span class=\"num\">8.0<\/span>", "    <span class=\"kw\">while<\/span> block_prob(hi, R, df) &lt; target:                             <span class=\"com\"># few degrees of freedom need a high cutoff<\/span>", "        hi *= <span class=\"num\">2<\/span>", "        <span class=\"kw\">if<\/span> hi &gt; <span class=\"num\">1e6<\/span>:", "            <span class=\"kw\">raise<\/span> StatsDesignError(<span class=\"str\">f&quot;no cutoff below {hi:g} reaches {target}&quot;<\/span>)", "    <span class=\"kw\">return<\/span> <span class=\"bi\">float<\/span>(brentq(<span class=\"kw\">lambda<\/span> c: block_prob(c, R, df) - target, <span class=\"num\">0.1<\/span>, hi, xtol=<span class=\"num\">1e-6<\/span>))", "", "", "<span class=\"kw\">def<\/span> <span class=\"fn\">adjusted_p<\/span>(t_value: <span class=\"bi\">float<\/span>, R: np.ndarray, df: <span class=\"bi\">float<\/span>, n_measures: <span class=\"bi\">int<\/span>) -&gt; <span class=\"bi\">float<\/span>:", "    <span class=\"doc\">&quot;&quot;&quot;The comparison&#x27;s p-value adjusted within its measure (Dunnett) and between measures (× n_measures).&quot;&quot;&quot;<\/span>", "    <span class=\"kw\">if<\/span> <span class=\"kw\">not<\/span> np.isfinite(t_value):", "        <span class=\"kw\">return<\/span> np.nan", "    <span class=\"kw\">return<\/span> <span class=\"bi\">float<\/span>(<span class=\"bi\">min<\/span>(<span class=\"num\">1.0<\/span>, <span class=\"bi\">max<\/span>(<span class=\"num\">0.0<\/span>, n_measures * (<span class=\"num\">1.0<\/span> - block_prob(<span class=\"bi\">abs<\/span>(t_value), R, df)))))", "", "", "<span class=\"com\"># =========================================================================== step 2&#x27;s results<\/span>", "", "<span class=\"kw\">def<\/span> <span class=\"fn\">_settings<\/span>(text: <span class=\"bi\">str<\/span>) -&gt; <span class=\"bi\">dict<\/span>:", "    <span class=\"doc\">&quot;&quot;&quot;A config&#x27;s settings without [statistics], as parsed TOML.&quot;&quot;&quot;<\/span>", "    data = tomllib.loads(text)", "    data.pop(<span class=\"str\">&quot;statistics&quot;<\/span>, <span class=\"kw\">None<\/span>)", "    <span class=\"kw\">return<\/span> data", "", "", "<span class=\"kw\">def<\/span> <span class=\"fn\">read_regions<\/span>(conf: Config) -&gt; pd.DataFrame:", "    <span class=\"doc\">&quot;&quot;&quot;Step 2&#x27;s dv.csv, after checking it is up to date: made from this config (apart from [statistics]),<\/span>", "<span class=\"doc\">    from step 1&#x27;s current files and, with a screen, from the screen&#x27;s current results.&quot;&quot;&quot;<\/span>", "    out = Path(conf.output_dir)", "    man_path, dv_path = out / <span class=\"str\">&quot;regions&quot;<\/span> / <span class=\"str\">&quot;manifest.json&quot;<\/span>, out / <span class=\"str\">&quot;regions&quot;<\/span> / <span class=\"str\">&quot;dv.csv&quot;<\/span>", "    <span class=\"kw\">if<\/span> <span class=\"kw\">not<\/span> (man_path.exists() <span class=\"kw\">and<\/span> dv_path.exists()):", "        <span class=\"kw\">raise<\/span> StatsInputError(<span class=\"str\">f&quot;no step 2 results in {out / &#x27;regions&#x27;}; run step 2 (region_dv.py) first&quot;<\/span>)", "    <span class=\"kw\">try<\/span>:", "        m = json.loads(man_path.read_text())", "        old_text, old_files, old_screen = m[<span class=\"str\">&quot;config_text&quot;<\/span>], m[<span class=\"str\">&quot;step1_files&quot;<\/span>], m.get(<span class=\"str\">&quot;screen_manifest&quot;<\/span>)", "    <span class=\"kw\">except<\/span> (<span class=\"bi\">ValueError<\/span>, <span class=\"bi\">KeyError<\/span>, <span class=\"bi\">TypeError<\/span>) <span class=\"kw\">as<\/span> exc:", "        <span class=\"kw\">raise<\/span> StatsInputError(<span class=\"str\">f&quot;step 2&#x27;s record {man_path} is damaged ({type(exc).__name__}: {exc}); re-run step 2&quot;<\/span>) <span class=\"kw\">from<\/span> <span class=\"kw\">None<\/span>", "    <span class=\"kw\">if<\/span> _settings(old_text) != _settings(conf.text):", "        <span class=\"kw\">raise<\/span> StatsInputError(<span class=\"str\">f&quo <script>
(() => {
  const DATA = JSON.parse(document.getElementById('trace-data').textContent);
  const PAGE = DATA.page;
  const trace = DATA.steps;
  const steps = [{ k: 'intro', d: -1 }, ...trace, { k: 'end', d: -1 }];
  const N = steps.length;
  const LABEL = '\n\nThe same values with labels (added by this page; the code holds only the numbers above):\n';

  // Replay the trace once so every step knows each variable's value before and after it.
  const fstate = {};
  for (const s of trace) {
    if (s.k === 'call' && !s.once) {
      fstate[s.f] = {};
      for (const [n, v] of s.c) fstate[s.f][n] = v;
    } else if (s.k === 'line' || (s.k === 'note' && s.loop)) {
      const st = fstate[s.f] || (fstate[s.f] = {});
      s.before = {};
      for (const [n, v] of s.c) { s.before[n] = st[n]; st[n] = v; }
    }
    s.vars = s.once ? {} : Object.assign({}, fstate[s.f] || {});
  }

  const $ = (id) => document.getElementById(id);
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const md = (t) => esc(t).replace(/`([^`]+)`/g, '<code>$1</code>');

  $('title-file').textContent = DATA.file;
  $('code-file').textContent = DATA.file;
  $('title-sub').textContent = PAGE.sub || '';
  if (PAGE.index) { $('home').href = PAGE.index; $('home').hidden = false; }

  // ---------------------------------------------------------------- source pane
  const ran = new Set(DATA.executed);
  $('src').innerHTML = DATA.source.map((h, i) => {
    const n = i + 1;
    return `<div class="ln${ran.has(n) ? ' ran' : ''}" id="L${n}"><button class="no" type="button" data-line="${n}" ` +
      `aria-label="Go to the next step at line ${n}">${n}</button><code>${h || ' '}</code></div>`;
  }).join('');
  const lineEl = (n) => document.getElementById('L' + n);
  let lit = [];
  function light(a, b, cls) {
    for (let n = a; n <= b; n++) { const el = lineEl(n); if (el) { el.classList.add(cls); lit.push(el); } }
  }
  function scrollToLine(n) {
    const pane = $('code-pane'), el = lineEl(n);
    if (!el) return;
    const head = pane.querySelector('.code-head').offsetHeight;
    const top = el.offsetTop, h = pane.clientHeight;
    if (top < pane.scrollTop + head + 24 || top > pane.scrollTop + h - 48) pane.scrollTop = Math.max(0, top - head - h * 0.3);
  }

  // ---------------------------------------------------------------- values
  function splitLabel(t) {
    if (t == null) return [null, null];
    const i = t.indexOf(LABEL);
    return i < 0 ? [t, null] : [t.slice(0, i), t.slice(i + LABEL.length)];
  }
  function preHTML(text, before) {
    const lines = String(text).split('\n');
    const old = before == null ? null : before.split('\n');
    return '<div class="valwrap"><pre class="val">' + lines.map((ln, i) =>
      `<span class="vl${old && old[i] !== ln ? ' d' : ''}">${esc(ln) || ' '}</span>`).join('') + '</pre></div>';
  }
  function valueHTML(text, before) {
    const [raw, lab] = splitLabel(text);
    const [braw, blab] = splitLabel(before);
    let h = preHTML(raw, braw);
    if (lab) h += '<div class="labcap">Labels added by this page: what each row, column or position stands for. The code itself holds only the values above.</div>' + preHTML(lab, blab);
    return h;
  }
  const TAG = { new: 'new', changed: 'changed', same: 'assigned, same value', arg: 'argument', ret: 'returned', plain: '' };
  function varHTML(name, text, status, before) {
    return `<div class="var"><div class="vhead"><code class="vname">${esc(name)}</code>` +
      `<span class="tag t-${status}">${TAG[status]}</span></div>${valueHTML(text, status === 'changed' ? before : null)}</div>`;
  }

  // ---------------------------------------------------------------- step views
  const BRANCH = {
    'if-in': 'The condition is <b>True</b>, so the indented block runs.',
    'if-out': 'The condition is <b>False</b>, so the indented block is skipped.',
    'if-in-else': 'The condition is <b>True</b>, so the indented block runs and the <code>else:</code> block is skipped.',
    'if-out-else': 'The condition is <b>False</b>, so the <code>else:</code> block runs instead.',
    'for-in': 'The loop takes its next item and runs its body with the values below.',
    'for-out': 'No items left, so the loop ends and the code carries on after it.',
    'while-in': 'The condition is <b>True</b>, so the loop body runs (again).',
    'while-out': 'The condition is <b>False</b> now, so the loop stops.',
  };
  const linesLabel = (l) => l[0] === l[1] ? `line ${l[0]}` : `lines ${l[0]}–${l[1]}`;
  function crumbs(s) {
    const parts = (s.st || []).map(([fn, a]) => `<span class="crumb">${esc(fn)} <span class="at">@${a}</span></span>`);
    parts.push(`<span class="crumb cur">${esc(s.fn)}</span>`);
    return `<div class="crumbs" title="Call stack: each caller and the line it is waiting on">${parts.join('<span class="sep">›</span>')}</div>`;
  }
  let allOpen = false;
  function allVarsHTML(s) {
    const names = Object.keys(s.vars || {});
    if (!names.length) return '';
    return `<details class="allvars"${allOpen ? ' open' : ''}><summary>Every variable in <code>${esc(s.fn)}</code> at this point (${names.length})</summary>` +
      `<div class="vars">${names.map((n) => varHTML(n, s.vars[n], 'plain')).join('')}</div></details>`;
  }
  function changedHTML(s, emptyText) {
    if (s.c.length) return `<div class="vars">${s.c.map(([n, v, st]) => varHTML(n, v, st, s.before[n])).join('')}</div>`;
    return `<p class="empty">${emptyText}</p>`;
  }
  function viewLine(s) {
    let h = crumbs(s) + `<div class="where"><span class="badge">ran</span><span class="lines">${linesLabel(s.l)}</span></div>`;
    if (s.n) h += `<p class="note">${md(s.n)}</p>`;
    if (s.b) h += `<p class="branch">${BRANCH[s.b] || ''}</p>`;
    h += '<h3>What this statement changed</h3>';
    h += changedHTML(s, `No variable in <code>${esc(s.fn)}</code> changed.${s.b ? ' This line only decided where the code goes next.' : ''}`);
    return h + allVarsHTML(s);
  }
  function viewCall(s) {
    if (s.once) {
      let h = crumbs(s) + `<div class="where"><span class="badge once">call · ran in one go</span><span class="lines">${esc(s.fn)}()</span></div>`;
      h += `<p class="muted">${md(s.w)}</p>`;
      if (s.n) h += `<p class="note">${md(s.n)}</p>`;
      h += '<h3>Arguments it received</h3>';
      h += s.c.length ? `<div class="vars">${s.c.map(([n, v]) => varHTML(n, v, 'arg')).join('')}</div>` : '<p class="empty">None.</p>';
      return h + '<h3>The value it returned</h3>' + varHTML('return value', s.r, 'ret');
    }
    let h = crumbs(s) + `<div class="where"><span class="badge call">call</span><span class="lines">${esc(s.fn)}()</span></div>`;
    h += `<p class="muted">${md(s.w)}</p>`;
    if (s.n) h += `<p class="note">${md(s.n)}</p>`;
    h += '<h3>Arguments it received</h3>';
    h += s.c.length ? `<div class="vars">${s.c.map(([n, v]) => varHTML(n, v, 'arg')).join('')}</div>` : '<p class="empty">None.</p>';
    return h;
  }
  function viewReturn(s) {
    const badge = s.err ? '<span class="badge err">error</span>' : '<span class="badge return">return</span>';
    let h = crumbs(s) + `<div class="where">${badge}<span class="lines">${esc(s.fn)}() finished</span></div>`;
    h += `<p class="note">${md(s.n)}</p><h3>${s.err ? 'The error' : 'The value it returns'}</h3>` + varHTML(s.err ? 'error' : 'return value', s.r, 'ret');
    return h + allVarsHTML(s);
  }
  function viewNote(s) {
    const warn = /Warning/.test(s.t || '');
    let h = crumbs(s) + `<div class="where"><span class="badge ${warn ? 'warn' : 'note'}">${esc(s.t)}</span><span class="lines">${linesLabel(s.l)}</span></div>`;
    h += `<p class="note">${md(s.n)}</p>`;
    if (s.x) h += preHTML(s.x, null);
    if (s.loop) {
      h += '<h3>What changed over those iterations</h3>' + changedHTML(s, 'No variable changed.');
      h += allVarsHTML(s);
    }
    return h;
  }
  function csvTable(text, greyR0) {
    const rows = text.trim().split('\n').map((r) => r.split(','));
    const head = rows.shift();
    const rec = greyR0 ? head.indexOf('recycle') : -1;
    return `<div class="tablewrap"><table class="csv"><thead><tr>${head.map((c) => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>` +
      rows.map((r) => `<tr class="${rec >= 0 && r[rec] === '0' ? 'r0' : ''}">${r.map((c) => `<td>${esc(c)}</td>`).join('')}</tr>`).join('') +
      '</tbody></table></div>';
  }
  // Page content comes from the walkthrough's own settings (trusted HTML written with the page).
  function blocksHTML(blocks) {
    return (blocks || []).map((b) => {
      if (b.h2) return `<h2>${b.h2}</h2>`;
      if (b.h3) return `<h3>${b.h3}</h3>`;
      if (b.p) return `<p>${b.p}</p>`;
      if (b.muted) return `<p class="muted">${b.muted}</p>`;
      if (b.callout) return `<p class="callout">${b.callout}</p>`;
      if (b.ul) return `<ul>${b.ul.map((x) => `<li>${x}</li>`).join('')}</ul>`;
      if (b.csv != null) return csvTable(b.csv, b.grey_r0);
      if (b.pre != null) return preHTML(String(b.pre).trimEnd(), null);
      return '';
    }).join('\n');
  }
  function viewIntro() {
    return `<div class="intro">
      ${blocksHTML(PAGE.intro)}
      <h3>Moving around</h3>
      <ul>
        <li><b>Next</b> or →: one step forward. It goes inside every function that gets called, so pressing Next over and over follows the run piece by piece.</li>
        <li><b>Back</b> or ←: one step back.</li>
        <li><b>Skip call</b>: active only when the next step enters a function. It runs that function in one go and shows the result on the line that called it.</li>
        <li><b>Finish function</b>: runs the rest of the current function in one go and stops on the value it returns.</li>
        <li>The <b>Up next</b> line under the buttons says what the next step will be.</li>
        <li><b>Jump to</b>: any function call stepped through, plus the special moments listed there.</li>
        <li>Click a <b>line number</b> to go to the next time that line runs.</li>
      </ul>
      <h3>How the trace was made</h3>
      <p class="muted">${PAGE.how || ''} The file ran unchanged on the toy data, under Python's line tracer, and every value shown is what the code held at that moment. To keep the walk readable, each function is stepped through the first time or two it is called; later calls show as one step, <b>call · ran in one go</b>, with their arguments and result. Long loops are stepped through for their first few rounds; the rest show as one step, <b>Loop runs on</b>, listing what changed. Comprehensions such as <code>[… for …]</code>, lambdas, and code in other files (numpy, pandas, the pipeline's other modules) run inside their line and are not stepped into.</p>
    </div>`;
  }
  function viewEnd() {
    return `<div class="intro">${blocksHTML(PAGE.end)}</div>`;
  }

  // ---------------------------------------------------------------- navigation
  const jump = $('jump');
  const marks = [];
  steps.forEach((s, i) => {
    let label = null;
    if (s.k === 'intro') label = 'Start: ' + (PAGE.start_label || 'the inputs');
    else if (s.k === 'end') label = 'End: ' + (PAGE.end_label || 'the results');
    else if (s.k === 'call' && !s.once && s.label) label = '  '.repeat(s.d) + s.label;
    else if (s.k === 'note' && s.menu) label = '  '.repeat(s.d) + '· ' + s.t.replace(' (printed to the terminal)', '');
    if (label) { marks.push(i); jump.insertAdjacentHTML('beforeend', `<option value="${i}">${esc(label)}</option>`); }
  });

  let cur = 0;
  const scrub = $('scrub');
  scrub.max = String(N - 1);
  function toast(t) { $('toast').textContent = t; }
  // Skip call: only when the next step enters a function. Lands on the first step back in the caller
  // (the line that made the call, now finished), or the end.
  function skipIdx(i) {
    const nx = steps[i + 1];
    if (!nx || nx.k !== 'call') return -1;
    for (let j = i + 2; j < N; j++) if (steps[j].k === 'end' || (steps[j].d < nx.d && steps[j].k !== 'note')) return j;
    return N - 1;
  }
  // Finish function: lands on the current function's return step. On a return step, or on a call that
  // already ran in one go, it finishes the caller.
  function finishIdx(i) {
    const s = steps[i];
    if (s.k === 'intro' || s.k === 'end') return -1;
    const outer = s.k === 'return' || s.once;
    for (let j = i + 1; j < N; j++) {
      const t = steps[j];
      if (t.k === 'end') return j;
      if (t.k === 'return' && (outer ? t.d === s.d - 1 : t.f === s.f)) return j;
    }
    return N - 1;
  }
  function upNext(i) {
    const s = steps[i], nx = steps[i + 1];
    if (!nx) return '';
    if (nx.k === 'end') return '<b>Up next:</b> ' + esc(PAGE.end_label || 'the results') + '.';
    if (nx.k === 'call') {
      const caller = nx.st && nx.st.length ? nx.st[nx.st.length - 1] : null;
      const who = caller ? `<code>${esc(caller[0])}</code> line ${caller[1]} calls` : 'the run starts with';
      if (nx.once) return `<b>Up next:</b> ${who} <code>${esc(nx.fn)}()</code>, shown as one step (it was stepped through earlier).`;
      return `<b>Up next:</b> ${who} <code>${esc(nx.fn)}()</code>. <b>Next</b> goes inside it; <b>Skip call</b> runs it in one go.`;
    }
    if (nx.k === 'return') return `<b>Up next:</b> <code>${esc(nx.fn)}()</code> finishes and hands back its result.`;
    if (nx.k === 'note') return `<b>Up next:</b> ${esc(nx.t.replace(' (printed to the terminal)', ''))}.`;
    if (s.k === 'return' || s.once || nx.d < s.d) return `<b>Up next:</b> back in <code>${esc(nx.fn)}</code>, ${linesLabel(nx.l)} finishes with that result.`;
    return `<b>Up next:</b> ${linesLabel(nx.l)} of <code>${esc(nx.fn)}</code>.`;
  }
  function go(i) { cur = Math.max(0, Math.min(N - 1, i)); toast(''); render(); }

  function render() {
    const s = steps[cur];
    for (const el of lit) el.classList.remove('cur', 'wait');
    lit = [];
    let html;
    if (s.k === 'intro') html = viewIntro();
    else if (s.k === 'end') html = viewEnd();
    else {
      for (const [, a, b] of s.st || []) if (a) light(a, b, 'wait');
      light(s.l[0], s.l[1], 'cur');
      html = s.k === 'line' ? viewLine(s) : s.k === 'call' ? viewCall(s) : s.k === 'return' ? viewReturn(s) : viewNote(s);
    }
    const state = $('state');
    state.innerHTML = html;
    state.scrollTop = 0;
    const det = state.querySelector('details.allvars');
    if (det) det.addEventListener('toggle', () => { allOpen = det.open; });
    if (s.l) scrollToLine(s.l[0]); else if (s.k === 'intro') $('code-pane').scrollTop = 0;
    $('counter').textContent = `step ${cur} of ${N - 1}`;
    $('btn-back').disabled = cur === 0;
    $('btn-next').disabled = cur === N - 1;
    $('btn-skip').disabled = skipIdx(cur) < 0;
    $('btn-finish').disabled = finishIdx(cur) < 0;
    $('upnext').innerHTML = upNext(cur);
    scrub.value = String(cur);
    let m = marks[0];
    for (const x of marks) if (x <= cur) m = x;
    jump.value = String(m);
  }

  $('btn-next').addEventListener('click', () => go(cur + 1));
  $('btn-back').addEventListener('click', () => go(cur - 1));
  $('btn-skip').addEventListener('click', () => { const j = skipIdx(cur); if (j >= 0) go(j); });
  $('btn-finish').addEventListener('click', () => { const j = finishIdx(cur); if (j >= 0) go(j); });
  scrub.addEventListener('input', () => go(Number(scrub.value)));
  jump.addEventListener('change', () => go(Number(jump.value)));
  $('src').addEventListener('click', (e) => {
    const b = e.target.closest('.no');
    if (!b) return;
    const n = Number(b.dataset.line);
    const hit = (j) => steps[j].k === 'line' && steps[j].l[0] <= n && n <= steps[j].l[1];
    for (let j = cur + 1; j < N; j++) if (hit(j)) return go(j);
    for (let j = 1; j < cur; j++) if (hit(j)) return go(j);
    toast(`No step stops at line ${n}: it never ran, or it ran only inside a call or loop shown in one go.`);
  });
  document.addEventListener('keydown', (e) => {
    if (e.target.closest && e.target.closest('select, input, textarea')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); go(cur + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); go(cur - 1); }
  });
  render();
})();
</script>
</body>
</html>
