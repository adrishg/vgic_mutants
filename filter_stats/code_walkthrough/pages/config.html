<style>
/* Layout: a debugger split. Source on the left, what each statement changed on the right, transport bar on top. */
:root {
  --bg: #f2f4f7; --surface: #ffffff; --surface-2: #f3f5f9; --ink: #18202b; --muted: #556070; --faint: #aab2be;
  --rule: #d8dde6; --accent: #2456c9; --accent-ink: #ffffff;
  --hl: #fff0b8; --hl-bar: #cf8f00; --wait: #e8eefc; --wait-bar: #8ea9e6; --diff: #fff3c7; --callout: #fbf6e6;
  --t-new: #1d7a46; --t-changed: #9a5800; --t-same: #687282; --t-arg: #2456c9; --t-ret: #7a3fb8; --t-warn: #b42318;
  --s-kw: #8b2fc9; --s-str: #1a7f37; --s-doc: #6f7a88; --s-com: #6f7a88; --s-num: #b35c00; --s-fn: #0b5cad; --s-bi: #9a4a00;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1218; --surface: #151a22; --surface-2: #1b212c; --ink: #e3e7ee; --muted: #9ba4b3; --faint: #535c6b;
    --rule: #29303d; --accent: #82a8ff; --accent-ink: #0e1218;
    --hl: #3b3213; --hl-bar: #e6b43a; --wait: #1b2540; --wait-bar: #5576c2; --diff: #393018; --callout: #2a2616;
    --t-new: #57c992; --t-changed: #e8a94f; --t-same: #8f98a7; --t-arg: #82a8ff; --t-ret: #c59dff; --t-warn: #ff8f85;
    --s-kw: #c99bf0; --s-str: #9bd38c; --s-doc: #7f899a; --s-com: #7f899a; --s-num: #f4aa7c; --s-fn: #86adff; --s-bi: #efb073;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1218; --surface: #151a22; --surface-2: #1b212c; --ink: #e3e7ee; --muted: #9ba4b3; --faint: #535c6b;
  --rule: #29303d; --accent: #82a8ff; --accent-ink: #0e1218;
  --hl: #3b3213; --hl-bar: #e6b43a; --wait: #1b2540; --wait-bar: #5576c2; --diff: #393018; --callout: #2a2616;
  --t-new: #57c992; --t-changed: #e8a94f; --t-same: #8f98a7; --t-arg: #82a8ff; --t-ret: #c59dff; --t-warn: #ff8f85;
  --s-kw: #c99bf0; --s-str: #9bd38c; --s-doc: #7f899a; --s-com: #7f899a; --s-num: #f4aa7c; --s-fn: #86adff; --s-bi: #efb073;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  box-sizing: border-box; margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.5 var(--sans);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
}
*, *::before, *::after { box-sizing: inherit; }
.app { height: 100%; display: flex; flex-direction: column; gap: 10px; min-height: 0; }

/* ---------------------------------------------------------------- top bar */
.top { display: flex; flex-direction: column; gap: 8px; }
.titlerow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
h1 { margin: 0; font: 600 18px/1.25 var(--sans); letter-spacing: -0.01em; text-wrap: balance; }
h1 code { font: 600 17px var(--mono); }
.sub { color: var(--muted); font-size: 13px; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.btn {
  font: 500 13px/1 var(--sans); padding: 8px 12px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--rule); background: var(--surface); color: var(--ink);
}
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn kbd { font: 500 11px var(--mono); opacity: 0.75; margin-left: 4px; }
button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.counter { font: 500 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 4px; }
.jump { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.jump select {
  font: 13px var(--sans); padding: 6px 8px; border-radius: 6px; border: 1px solid var(--rule);
  background: var(--surface); color: var(--ink); max-width: 15rem;
}
.spacer { flex: 1; }
#scrub { width: 100%; accent-color: var(--accent); margin: 0; }

/* ---------------------------------------------------------------- panes */
.panes { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 12px; }
.pane { min-height: 0; overflow: auto; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; position: relative; }
@media (max-width: 860px) {
  .panes { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 38%) minmax(0, 62%); }
}

/* ---------------------------------------------------------------- source */
.code-head {
  position: sticky; top: 0; left: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline;
  padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--rule); font-size: 12px; color: var(--muted);
}
.code-head b { font: 600 12px var(--mono); color: var(--ink); }
.legend { display: inline-flex; gap: 10px; flex-wrap: wrap; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; }
.sw.cur { background: var(--hl); box-shadow: inset 3px 0 0 var(--hl-bar); }
.sw.wait { background: var(--wait); box-shadow: inset 3px 0 0 var(--wait-bar); }
.src { min-width: max-content; padding: 6px 0 40vh; }
.ln { display: grid; grid-template-columns: 4.6ch minmax(0, 1fr); box-shadow: inset 3px 0 0 transparent; }
.ln .no {
  all: unset; cursor: pointer; text-align: right; padding-right: 10px; color: var(--faint);
  font: 11.5px/1.6 var(--mono); font-variant-numeric: tabular-nums; user-select: none;
}
.ln.ran .no { color: var(--muted); }
.ln .no:hover { color: var(--accent); text-decoration: underline; }
.ln .no:focus-visible { outline: 2px solid var(--accent); }
.ln code { white-space: pre; font: 12.5px/1.6 var(--mono); padding-right: 16px; }
.ln.wait { background: var(--wait); box-shadow: inset 3px 0 0 var(--wait-bar); }
.ln.cur { background: var(--hl); box-shadow: inset 3px 0 0 var(--hl-bar); }
.kw { color: var(--s-kw); } .str { color: var(--s-str); } .doc { color: var(--s-doc); font-style: italic; }
.com { color: var(--s-com); font-style: italic; } .num { color: var(--s-num); } .fn { color: var(--s-fn); font-weight: 500; }
.bi { color: var(--s-bi); }

/* ---------------------------------------------------------------- state */
.state { padding: 14px 16px 28px; display: flex; flex-direction: column; gap: 12px; }
.state > * { margin: 0; min-width: 0; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; font: 12px var(--mono); color: var(--muted); }
.crumb.cur { color: var(--ink); font-weight: 600; }
.crumb .at { color: var(--faint); }
.sep { color: var(--faint); }
.where { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.where .lines { font: 600 15px var(--mono); }
.badge {
  font: 600 11px/1 var(--sans); text-transform: uppercase; letter-spacing: 0.06em; padding: 4px 7px; border-radius: 4px;
  color: var(--muted); border: 1px solid var(--rule);
}
.badge.call { color: var(--t-arg); border-color: currentColor; }
.badge.return { color: var(--t-ret); border-color: currentColor; }
.badge.note { color: var(--t-changed); border-color: currentColor; }
.badge.warn { color: var(--t-warn); border-color: currentColor; }
.note { font-size: 14.5px; line-height: 1.55; max-width: 68ch; }
.note code, .branch code, .intro code, .muted code { font: 0.92em var(--mono); background: var(--surface-2); padding: 1px 4px; border-radius: 3px; }
.branch {
  font-size: 13.5px; padding: 8px 10px; border-radius: 6px; background: var(--surface-2); border-left: 3px solid var(--accent);
  max-width: 68ch;
}
.callout { font-size: 13.5px; padding: 10px 12px; border-radius: 6px; background: var(--callout); border-left: 3px solid var(--hl-bar); max-width: 68ch; }
h2 { margin: 0; font: 600 16px/1.3 var(--sans); text-wrap: balance; }
h3 {
  margin: 4px 0 0; font: 600 11px/1.2 var(--sans); text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted);
}
.muted { color: var(--muted); font-size: 13px; max-width: 68ch; }
.vars { display: flex; flex-direction: column; gap: 12px; }
.var { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.vhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.vname { font: 600 13.5px var(--mono); }
.tag {
  font: 600 10.5px/1 var(--sans); text-transform: uppercase; letter-spacing: 0.06em; padding: 3px 6px; border-radius: 4px;
  background: color-mix(in srgb, currentColor 12%, transparent);
}
.t-new { color: var(--t-new); } .t-changed { color: var(--t-changed); } .t-same { color: var(--t-same); }
.t-arg { color: var(--t-arg); } .t-ret { color: var(--t-ret); } .t-plain { display: none; }
.valwrap { overflow-x: auto; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--rule); }
pre.val { display: inline-block; min-width: 100%; margin: 0; padding: 8px 0; font: 12.5px/1.5 var(--mono); font-variant-numeric: tabular-nums; }
.vl { display: block; padding: 0 12px; white-space: pre; }
.vl.d { background: var(--diff); box-shadow: inset 3px 0 0 var(--hl-bar); }
.labcap { font-size: 12px; color: var(--muted); margin-top: 2px; }
details.allvars { border-top: 1px solid var(--rule); padding-top: 10px; }
details.allvars summary { cursor: pointer; font-size: 13px; color: var(--muted); }
details.allvars .vars { margin-top: 10px; }
.empty { color: var(--muted); font-size: 13.5px; font-style: italic; }
.intro ul, .intro ol { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 3px; max-width: 68ch; }
.intro p { margin: 0; max-width: 68ch; }
.intro { display: flex; flex-direction: column; gap: 12px; }
table.csv { border-collapse: collapse; font: 12px/1.4 var(--mono); font-variant-numeric: tabular-nums; }
table.csv th, table.csv td { padding: 3px 10px; text-align: right; border-bottom: 1px solid var(--rule); white-space: nowrap; }
table.csv th { font-weight: 600; color: var(--muted); position: sticky; top: 0; background: var(--surface-2); }
table.csv td:nth-child(-n+3), table.csv th:nth-child(-n+3) { text-align: left; }
table.csv tr.r0 td { color: var(--faint); }
.tablewrap { overflow: auto; max-height: 22rem; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface-2); }
.hintrow { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; min-height: 1.6em; align-items: baseline; }
.upnext { color: var(--muted); }
.upnext b { color: var(--ink); font-weight: 600; }
.upnext code { font: 0.92em var(--mono); color: var(--ink); background: var(--surface); border: 1px solid var(--rule); padding: 0 4px; border-radius: 3px; }
.toast { color: var(--t-warn); }
.home { font-size: 13px; color: var(--accent); text-decoration: none; }
.home:hover { text-decoration: underline; }
.badge.once { color: var(--t-same); border-color: currentColor; }
.badge.err { color: var(--t-warn); border-color: currentColor; }
.pipe { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 6px; align-items: baseline; }
.pipe .on { color: var(--ink); font-weight: 600; }
@media (prefers-reduced-motion: no-preference) { .ln, .vl { transition: background-color 120ms ease; } }
</style>
</head>

<div class="app">
  <header class="top">
    <div class="titlerow">
      <h1><code id="title-file"></code>, one statement at a time</h1>
      <span class="sub" id="title-sub"></span>
      <span class="spacer"></span>
      <a class="home" id="home" href="../index.html" hidden>All walkthroughs</a>
    </div>
    <div class="controls">
      <button class="btn" id="btn-back" type="button" title="Go back one step">Back<kbd>←</kbd></button>
      <button class="btn primary" id="btn-next" type="button" title="One step forward. Goes inside every function that gets called.">Next<kbd>→</kbd></button>
      <button class="btn" id="btn-skip" type="button" title="Only when the next step enters a function: run that function in one go and show the line's result">Skip call</button>
      <button class="btn" id="btn-finish" type="button" title="Run the rest of the current function in one go and show what it returns">Finish function</button>
      <label class="jump" for="jump">Jump to <select id="jump"></select></label>
      <span class="spacer"></span>
      <span class="counter" id="counter" aria-live="polite"></span>
    </div>
    <input type="range" id="scrub" min="0" max="1" value="0" aria-label="Step">
    <div class="hintrow"><span class="upnext" id="upnext" aria-live="polite"></span><span class="toast" id="toast" role="status"></span></div>
  </header>
  <main class="panes">
    <section class="pane" id="code-pane" aria-label="Source code">
      <div class="code-head">
        <b id="code-file"></b>
        <span class="legend">
          <span><span class="sw cur"></span>the statement that just ran</span>
          <span><span class="sw wait"></span>a caller waiting for it</span>
          <span>faint numbers: no step stops there · click a number to go to it</span>
        </span>
      </div>
      <div class="src" id="src"></div>
    </section>
    <section class="pane state" id="state" aria-label="What this statement did"></section>
  </main>
</div>

alse)<\/span>", "<span class=\"doc\">    wiring = true                           # optional switches, defaults as shown<\/span>", "<span class=\"doc\">    own_place = true<\/span>", "<span class=\"doc\">    box_corners = true<\/span>", "<span class=\"doc\">    s6_on_own_s5 = true<\/span>", "<span class=\"doc\">    filter_quarter = false<\/span>", "<span class=\"doc\">    omit = &quot;&lt;file&gt;&quot;                         # optional CSV: condition,model,seed,reason (removed by hand)<\/span>", "<span class=\"doc\">    [segments]                              # with [screen]: one subunit&#x27;s segments, for four chains<\/span>", "<span class=\"doc\">    S1 = [&lt;start&gt;, &lt;end&gt;]                   # ... S2, S3, S4, linker, S5, pore_helix, filter,<\/span>", "<span class=\"doc\">                                            # S6_upper, S6_lower, in this order, inside the measure set<\/span>", "<span class=\"doc\">    [[segments]]                            # or, for one chain with four repeats (Nav, Cav): four<\/span>", "<span class=\"doc\">                                            # tables, one per repeat, in order<\/span>", "<span class=\"doc\">    [statistics]                            # optional (row 4, fit_model.py)<\/span>", "<span class=\"doc\">    min_models_per_group = 10               # groups (condition × network × recycle) with fewer models are<\/span>", "<span class=\"doc\">                                            # left out of the fit (D-068); 0 keeps every group<\/span>", "<span class=\"doc\"><\/span>", "<span class=\"doc\">`load_config(path)` returns a `Config` or raises `ConfigError` naming the offending value. It<\/span>", "<span class=\"doc\">checks everything that can be checked without reading the archives or the structure (D-037,<\/span>", "<span class=\"doc\">D-040, D-041, D-045, D-046, D-054); it reads only the config and the UniProt FASTA, and creates<\/span>", "<span class=\"doc\">nothing.<\/span>", "<span class=\"doc\">&quot;&qu one of these names would clash with them (D-037 item 4).<\/span>", "RESERVED = {<span class=\"str\">&quot;condition&quot;<\/span>, <span class=\"str\">&quot;model&quot;<\/span>, <span class=\"str\">&quot;seed&quot;<\/span>, <span class=\"str\">&quot;recycle&quot;<\/span>, <span class=\"str\">&quot;prediction&quot;<\/span>, <span class=\"str\">&quot;mapping&quot;<\/span>, <span class=\"str\">&quot;core_fit_rmsd&quot;<\/span>, *REGION_DVS}", "TOP_KEYS = {<span class=\"str\">&quot;name&quot;<\/span>, <span class=\"str\">&quot;uniprot_fasta&quot;<\/span>, <span class=\"str\">&quot;output_dir&quot;<\/span>, <span class=\"str\">&quot;model_chains&quot;<\/span>, <span class=\"str\">&quot;reference&quot;<\/span>, <span class=\"str\">&quot;ranges&quot;<\/span>, <span class=\"str\">&quot;regions&quot;<\/span>, <span class=\"str\">&quot;design&quot;<\/span>,", "            <span class=\"str\">&quot;frame&quot;<\/span>, <span class=\"str\">&quot;conditions&quot;<\/span>, <span class=\"str\">&quot;screen&quot;<\/span>, <span class=\"str\">&quot;segments&quot;<\/span>, <span class=\"str\">&quot;statistics&quot;<\/span>}", "MIN_MODELS_DEFAULT = <span class=\"num\">10<\/span>                                  <span class=\"com\"># D-068<\/span>", "<span class=\"com\"># the topology screen (D-063): the ten segments of a subunit, in sequence order, and the checks&#x27; switches<\/span>", "ELEMENTS = (<span class=\"str\">&quot;S1&quot;<\/span>, <span class=\"str\">&quot;S2&quot;<\/span>, <span class=\"str\">&quot;S3&quot;<\/span>, <span class=\"str\">&quot;S4&quot;<\/span>, <span class=\"str\">&quot;linker&quot;<\/span>, <span class=\"str\">&quot;S5&quot;<\/span>, <span class=\"str\">&quot;pore_helix&quot;<\/span>, <span class=\"str\">&quot;filter&quot;<\/span>, <span class=\"str\">&quot;S6_upper&quot;<\/span>, <span class=\"str\">&quot;S6_lower&quot;<\/span>)", "SCREEN_SWITCHES = {<span class=\"str\">&quot;wiring&quot;<\/span>: <span class=\"kw\">True<\/span>, <span class=\"str\">&quo ecycle: <span class=\"bi\">int<\/span> | <span class=\"kw\">None<\/span> = <span class=\"kw\">None<\/span>                           <span class=\"com\"># None = the last recycle<\/span>", "", "", "@dataclass", "<span class=\"kw\">class<\/span> <span class=\"fn\">Screen<\/span>:                                            <span class=\"com\"># the switches&#x27; defaults are SCREEN_SWITCHES<\/span>", "    domain_swapped: <span class=\"bi\">bool<\/span>", "    wiring: <span class=\"bi\">bool<\/span>", "    own_place: <span class=\"bi\">bool<\/span>", "    box_corners: <span class=\"bi\">bool<\/span>", "    s6_on_own_s5: <span class=\"bi\">bool<\/span>", "    filter_quarter: <span class=\"bi\">bool<\/span>", "    omit: Path | <span class=\"kw\">None<\/span> = <span class=\"kw\">None<\/span>                             <span class=\"com\"># CSV of predictions removed by hand<\/span>", "    omitted: <span class=\"bi\">list<\/span> = field(default_factory=<span class=\"bi\">list<\/span>)          <span class=\"com\"># its rows: (condition, model, seed, reason)<\/span>", "", "", "@dataclass", "<span class=\"kw\">class<\/span> <span class=\"fn\">Config<\/span>:", "    path: Path                                           <span class=\"com\"># the config file<\/span>", "    text: <span class=\"bi\">str<\/span>                                            <span class=\"com\"># its TOML text, exactly as written (D-043)<\/span>", "    name: <span class=\"bi\">str<\/span>", "    output_dir: Path", "    uniprot_fasta: Path", "    uniprot: <span class=\"bi\">str<\/span>                                         <span class=\"com\"># the UniProt sequence read from the FASTA<\/span>", "    model_chains: <span class=\"bi\">list<\/span>", "    reference: Reference | <span class=\"kw\">None<\/span>", "    factors: <span class=\"bi\">list<\/span>", "    conditions: <span class=\"bi\">list<\/span>", "    control: <span class=\"bi\">str<\/span>", "    fit: <span class=\"bi\">list<\/span>                                            <span class=\"com\"># [(start, end)], inclusive, UniProt numbering<\/span>", "    measure: <span class=\"bi\">list<\/span>", "    treated: <span class=\"bi\">list<\/span>", "    frame: Frame | <span class=\"kw\">None<\/span>", "    regions: <span class=\"bi\">dict<\/span> = field(default_factory=<span class=\"bi\">dict<\/span>)          <span class=\"com\"># name -&gt; [(start, end)], in the order written (D-060)<\/span>", "    screen: Screen | <span class=\"kw\">None<\/span> = <span class=\"kw\">None<\/span>                         <span class=\"com\"># the topology screen&#x27;s settings (D-063)<\/span>", "    segments: <span class=\"bi\">list<\/span> = field(default_factory=<span class=\"bi\">list<\/span>)         <span class=\"com\"># one table (four chains) or four (one chain)<\/span>", "    min_models_per_group: <span class=\"bi\">int<\/span> = MIN_MODELS_DEFAULT       <span class=\"com\"># the statistics&#x27; minimum group size (D-068)<\/span>", "", "    <span class=\"kw\">def<\/span> <span class=\"fn\">condition<\/span>(self, name: <span class=\"bi\">str<\/span>) -&gt; Condition:", "        <span class=\"kw\">return<\/span> <span class=\"bi\">next<\/span>(c <span class=\"kw\">for<\/span> c <span class=\"kw\">in<\/span> self.conditions <span class=\"kw\">if<\/span> c.name == name)", "", "", "<span class=\"com\"># --------------------------------------------------------------------------- small checks<\/span>", "", "<span class=\"kw\">def<\/span> <span class=\"fn\">_need<\/span>(table: <span class=\"bi\">dict<\/span>, key: <span class=\"bi\">str<\/span>, where: <span class=\"bi\">str<\/span>):", "    <span class=\"kw\">if<\/span> key <span class=\"kw\">not<\/span> <span class=\"kw\">in<\/span> table:", "        <span class=\"kw\">raise<\/span> ConfigError(<span class=\"str\">f&quot;{where}: missing &#x27;{key}&#x27;&quot;<\/span>)", "    <span class=\"kw\">return<\/span> table[key]", "", "", "<span class=\"kw\">def<\/span> <span class=\"fn\">_no_unknown_keys<\/span>(table: <span class=\"bi\">dict<\/span>, allowed: <span class=\"bi\">set<\/span>, where: <span class=\"bi\">str<\/span>) -&gt; <span class=\"kw\">None<\/span>:", "    unknown = <span class=\"bi\">sorted<\/span>(<span class=\"bi\">set<\/span>(table) - allowed)", "    <span class=\"kw\">if<\/span> unknown:", "        <span class=\"kw\">raise<\/span> ConfigError(<span class=\"str\">f&quot;{where}: unknown key(s) {unknown} (allowed: {sorted(allowed)})&quot;<\/span>)", "", "", "<span class=\"kw\">def<\/span> <span class=\"fn\">_is_int<\/span>(v) -&gt; <span class=\"bi\">bool<\/span>:", "    <span class=\"kw\">return<\/span> <span class=\"bi\">isinstance<\/span>(v, <span class=\"bi\">int<\/span>) <span class=\"kw\">and<\/span> <span class=\"kw\">not<\/span> <span class=\"bi\">isinstance<\/span>(v, <span class=\"bi\">bool<\/span>)", "", "", "<span class=\"kw\">def<\/span> <span class=\"fn\">_string_list<\/span>(value, where: <span class=\"bi\">str<\/span>, allow_empty: <span class=\"bi\">bool<\/span> = <span class=\"kw\">False<\/span>) -&gt; <span class=\"bi\">list<\/span>:", "    <span class=\"kw\">if<\/span> <span class=\"kw\">not<\/span> <span class=\"bi\">isinstance<\/span>(value, <span class=\"bi\">list<\/span>) <span class=\"kw\">or<\/span> <span class=\"kw\">not<\/span> <span class=\"bi\">all<\/span>(<span class=\"bi\">isinstance<\/span>(x, <span class=\"bi\">str<\/span>) <span class=\"kw\">and<\/span> x <span class=\"kw\">for<\/span> x <span class=\"kw\">in<\/span> value):", "        <span class=\"kw\">raise<\/span> ConfigError(<span class=\"str\">f&quot;{where} must be a list of non-empty strings, got {value!r}&quot;<\/span>)", "    <span class=\"kw\">if<\/span> <span class=\"kw\">not<\/span> value <span class=\"kw\">and<\/span> <span class=\"kw\">not<\/span> allow_empty:", "        <span class=\"kw\">raise<\/span> ConfigError(<span class=\"str\">f&quot;{where} must not be empty&quot;<\/span>)", "    repeated = <span cl ss=\"str\">f&quot;{where}: {r!r} is not a pair of integers [start, end]&quot;<\/span>)", "        start, end = r", "        <span class=\"kw\">if<\/span> <span class=\"kw\">not<\/span> <span class=\"num\">1<\/span> &lt;= start &lt;= end &lt;= n_uniprot:", "            <span class=\"kw\">raise<\/span> ConfigError(<span class=\"str\">f&quot;{where}: {r!r} must satisfy 1 &lt;= start &lt;= end &lt;= {n_uniprot} &quot;<\/span>", "                              <span class=\"str\">f&quot;(the UniProt sequence&#x27;s length)&quot;<\/span>)", "        out.append((start, end))", "    <span class=\"kw\">return<\/span> out", "", "", "<span class=\"kw\">def<\/span> <span class=\"fn\">_positions<\/span>(value, where: <span class=\"bi\">str<\/span>, n_uniprot: <span class=\"bi\">int<\/span>, letters=AMINO_ACIDS) -&gt; <span class=\"bi\">dict<\/span>:", "    <span class=\"doc\">&quot;&quot;&quot;{&quot;&lt;UniProt number&gt;&quot;: &quot;&lt;letter&gt;&quot;} -&gt; {int: letter}, checked against the UniProt sequence.&quot;&quot;&quot;<\/span>", "    <span class=\"kw\">if<\/span> <span class=\"kw\">not<\/span> <span class=\"bi\">isinstance<\/span>(value, <span class=\"bi\">dict<\/span>):", "        <span class=\"kw\">raise<\/span> ConfigError(<span class=\"str\">f&quot;{where} must be a table of UniProt number = letter, got {value!r}&quot;<\/span>)", "    out, written = {}, {}", "    <span class=\"kw\">for<\/span> key, letter <span class=\"kw\">in<\/span> value.items():", "        <span class=\"kw\">if<\/span> <span class=\"kw\">not<\/span> re.fullmatch(<span class=\"str\">r&quot;[0-9]+&quot;<\/span>, <span class=\"bi\">str<\/span>(key)) <span class=\"kw\">or<\/span> <span class=\"kw\">not<\/span> <span class=\"num\">1<\/span> &lt;= <span class=\"bi\">int<\/span>(key) &lt;= n_uniprot:", "            <span class=\"kw\">raise<\/span> ConfigError(<span class=\"str\">f&quot;{where}: position {key!r} is not a UniProt residue number (1-{n_uniprot})&quot;<\/span>)", "        <span class=\" <script>
(() => {

  const LABEL = '\n\nThe same values with labels (added by this page; the code holds only the numbers above):\n';

  // Replay the trace once so every step knows each variable's value before and after it.

      for (const [n, v] of s.c) fstate[s.f][n] = v;

      for (const [n, v] of s.c) { s.before[n] = st[n]; st[n] = v; }

  const $ = (id) => document.getElementById(id);

  const md = (t) => esc(t).replace(/`([^`]+)`/g, '<code>$1</code>');

  $('title-file').textContent = DATA.file;
  $('code-file').textContent = DATA.file;
  $('title-sub').textContent = PAGE.sub || '';
  if (PAGE.index) { $('home').href = PAGE.index; $('home').hidden = false; }

  // ---------------------------------------------------------------- source pane
  const ran = new Set(DATA.executed);
  $('src').innerHTML = DATA.source.map((h, i) => {
    const n = i + 1;
    return `<div class="ln${ran.has(n) ? ' ran' : ''}" id="L${n}"><button class="no" type="button" data-line="${n}" ` +

  }).join('');
  const lineEl = (n) => document.getElementById('L' + n);
  let lit = [];
  function light(a, b, cls) {
    for (let n = a; n <= b; n++) { const el = lineEl(n); if (el) { el.classList.add(cls); lit.push(el); } }
  }
  function scrollToLine(n) {
    const pane = $('code-pane'), el = lineEl(n);
    if (!el) return;

    const top = el.offsetTop, h = pane.clientHeight;
    if (top < pane.scrollTop + head + 24 || top > pane.scrollTop + h - 48) pane.scrollTop = Math.max(0, top - head - h * 0.3);
  }

  // ---------------------------------------------------------------- values
  function splitLabel(t) {
    if (t == null) return [null, null];
    const i = t.indexOf(LABEL);
    return i < 0 ? [t, null] : [t.slice(0, i), t.slice(i + LABEL.length)];
  }
  function preHTML(text, before) {
    const lines = String(text).split('\n');
    const old = before == null ? null : before.split('\n');

      `<span class="vl${old && old[i] !== ln ? ' d' : ''}">${esc(ln) || ' '}</span>`).join('') + '</pre></div>';
  }
  function valueHTML(text, before) {
    const [raw, lab] = splitLabel(text);
    const [braw, blab] = splitLabel(before);
    let h = preHTML(raw, braw);
    if (lab) h += '<div class="labcap">Labels added by this page: what each row, column or position stands for. The code itself holds only the values above.</div>' + preHTML(lab, blab);
    return h;
  }
  const TAG = { new: 'new', changed: 'changed', same: 'assigned, same value', arg: 'argument', ret: 'returned', plain: '' };
  function varHTML(name, text, status, before) {
    return `<div class="var"><div class="vhead"><code class="vname">${esc(name)}</code>` +
      `<span class="tag t-${status}">${TAG[status]}</span></div>${valueHTML(text, status === 'changed' ? before : null)}</div>`;
  }

  // ---------------------------------------------------------------- step views
  const BRANCH = {
    'if-in': 'The condition is <b>True</b>, so the indented block runs.',
    'if-out': 'The condition is <b>False</b>, so the indented block is skipped.',
    'if-in-else': 'The condition is <b>True</b>, so the indented block runs and the <code>else:</code> block is skipped.',
    'if-out-else': 'The condition is <b>False</b>, so the <code>else:</code> block runs instead.',
    'for-in': 'The loop takes its next item and runs its body with the values below.',
    'for-out': 'No items left, so the loop ends and the code carries on after it.',
    'while-in': 'The condition is <b>True</b>, so the loop body runs (again).',
    'while-out': 'The condition is <b>False</b> now, so the loop stops.',
  };
  const linesLabel = (l) => l[0] === l[1] ? `line ${l[0]}` : `lines ${l[0]}–${l[1]}`;
  function crumbs(s) {
    const parts = (s.st || []).map(([fn, a]) => `<span class="crumb">${esc(fn)} <span class="at">@${a}</span></span>`);

  }

  function allVarsHTML(s) {

  }
  function viewLine(s) {

  }
  function viewCall(s) {

      if (s.n) h += `<p class="note">${md(s.n)}</p>`;
      h += '<h3>Arguments it received</h3>';
      h += s.c.length ? `<div class="vars">${s.c.map(([n, v]) => varHTML(n, v, 'arg')).join('')}</div>` : '<p class="empty">None.</p>';
      return h + '<h3>The value it returned</h3>' + varHTML('return value', s.r, 'ret');
    }
    let h = crumbs(s) + `<div class="where"><span class="badge call">call</span><span class="lines">${esc(s.fn)}()</span></div>`;
    h += `<p class="muted">${md(s.w)}</p>`;
    if (s.n) h += `<p class="note">${md(s.n)}</p>`;
    h += '<h3>Arguments it received</h3>';
    h += s.c.length ? `<div class="vars">${s.c.map(([n, v]) => varHTML(n, v, 'arg')).join('')}</div>` : '<p class="empty">None.</p>';

  }
  function viewReturn(s) {

    h += `<p class="note">${md(s.n)}</p><h3>${s.err ? 'The error' : 'The value it returns'}</h3>` + varHTML(s.err ? 'error' : 'return value', s.r, 'ret');
    return h + allVarsHTML(s);
  }
  function viewNote(s) {
    const warn = /Warning/.test(s.t || '');

    h += `<p class="note">${md(s.n)}</p>`;
    if (s.x) h += preHTML(s.x, null);
    if (s.loop) {

  }
  function csvTable(text, greyR0) {
    const rows = text.trim().split('\n').map((r) => r.split(','));
    const head = rows.shift();
    const rec = greyR0 ? head.indexOf('recycle') : -1;
    return `<div class="tablewrap"><table class="csv"><thead><tr>${head.map((c) => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>` +
      rows.map((r) => `<tr class="${rec >= 0 && r[rec] === '0' ? 'r0' : ''}">${r.map((c) => `<td>${esc(c)}</td>`).join('')}</tr>`).join('') +
      '</tbody></table></div>';
  }
  // Page content comes from the walkthrough's own settings (trusted HTML written with the page).
  function blocksHTML(blocks) {
    return (blocks || []).map((b) => {
      if (b.h2) return `<h2>${b.h2}</h2>`;
      if (b.h3) return `<h3>${b.h3}</h3>`;
      if (b.p) return `<p>${b.p}</p>`;
      if (b.muted) return `<p class="muted">${b.muted}</p>`;
      if (b.callout) return `<p class="callout">${b.callout}</p>`;
      if (b.ul) return `<ul>${b.ul.map((x) => `<li>${x}</li>`).join('')}</ul>`;
      if (b.csv != null) return csvTable(b.csv, b.grey_r0);
      if (b.pre != null) return preHTML(String(b.pre).trimEnd(), null);
      return '';
    }).join('\n');
  }
  function viewIntro() {
    return `<div class="intro">
      ${blocksHTML(PAGE.intro)}
      <h3>Moving around</h3>
      <ul>
        <li><b>Next</b> or →: one step forward. It goes inside every function that gets called, so pressing Next over and over follows the run piece by piece.</li>
        <li><b>Back</b> or ←: one step back.</li>
        <li><b>Skip call</b>: active only when the next step enters a function. It runs that function in one go and shows the result on the line that called it.</li>
        <li><b>Finish function</b>: runs the rest of the current function in one go and stops on the value it returns.</li>
        <li>The <b>Up next</b> line under the buttons says what the next step will be.</li>
        <li><b>Jump to</b>: any function call stepped through, plus the special moments listed there.</li>
        <li>Click a <b>line number</b> to go to the next time that line runs.</li>
      </ul>
      <h3>How the trace was made</h3>
      <p class="muted">${PAGE.how || ''} The file ran unchanged on the toy data, under Python's line tracer, and every value shown is what the code held at that moment. To keep the walk readable, each function is stepped through the first time or two it is called; later calls show as one step, <b>call · ran in one go</b>, with their arguments and result. Long loops are stepped through for their first few rounds; the rest show as one step, <b>Loop runs on</b>, listing what changed. Comprehensions such as <code>[… for …]</code>, lambdas, and code in other files (numpy, pandas, the pipeline's other modules) run inside their line and are not stepped into.</p>
    </div>`;
  }
  function viewEnd() {
    return `<div class="intro">${blocksHTML(PAGE.end)}</div>`;
  }

  // ---------------------------------------------------------------- navigation
  const jump = $('jump');
  const marks = [];
  steps.forEach((s, i) => {
    let label = null;
    if (s.k === 'intro') label = 'Start: ' + (PAGE.start_label || 'the inputs');
    else if (s.k === 'end') label = 'End: ' + (PAGE.end_label || 'the results');
    else if (s.k === 'call' && !s.once && s.label) label = '  '.repeat(s.d) + s.label;
    else if (s.k === 'note' && s.menu) label = '  '.repeat(s.d) + '· ' + s.t.replace(' (printed to the terminal)', '');
    if (label) { marks.push(i); jump.insertAdjacentHTML('beforeend', `<option value="${i}">${esc(label)}</option>`); }
  });

  let cur = 0;
  const scrub = $('scrub');
  scrub.max = String(N - 1);
  function toast(t) { $('toast').textContent = t; }
  // Skip call: only when the next step enters a function. Lands on the first step back in the caller
  // (the line that made the call, now finished), or the end.
  function skipIdx(i) {
    const nx = steps[i + 1];
    if (!nx || nx.k !== 'call') return -1;
    for (let j = i + 2; j < N; j++) if (steps[j].k === 'end' || (steps[j].d < nx.d && steps[j].k !== 'note')) return j;
    return N - 1;
  }
  // Finish function: lands on the current function's return step. On a return step, or on a call that
  // already ran in one go, it finishes the caller.
  function finishIdx(i) {
    const s = steps[i];
    if (s.k === 'intro' || s.k === 'end') return -1;
    const outer = s.k === 'return' || s.once;
    for (let j = i + 1; j < N; j++) {
      const t = steps[j];
      if (t.k === 'end') return j;
      if (t.k === 'return' && (outer ? t.d === s.d - 1 : t.f === s.f)) return j;
    }
    return N - 1;
  }
  function upNext(i) {
    const s = steps[i], nx = steps[i + 1];
    if (!nx) return '';
    if (nx.k === 'end') return '<b>Up next:</b> ' + esc(PAGE.end_label || 'the results') + '.';
    if (nx.k === 'call') {
      const caller = nx.st && nx.st.length ? nx.st[nx.st.length - 1] : null;
      const who = caller ? `<code>${esc(caller[0])}</code> line ${caller[1]} calls` : 'the run starts with';
      if (nx.once) return `<b>Up next:</b> ${who} <code>${esc(nx.fn)}()</code>, shown as one step (it was stepped through earlier).`;
      return `<b>Up next:</b> ${who} <code>${esc(nx.fn)}()</code>. <b>Next</b> goes inside it; <b>Skip call</b> runs it in one go.`;
    }
    if (nx.k === 'return') return `<b>Up next:</b> <code>${esc(nx.fn)}()</code> finishes and hands back its result.`;
    if (nx.k === 'note') return `<b>Up next:</b> ${esc(nx.t.replace(' (printed to the terminal)', ''))}.`;
    if (s.k === 'return' || s.once || nx.d < s.d) return `<b>Up next:</b> back in <code>${esc(nx.fn)}</code>, ${linesLabel(nx.l)} finishes with that result.`;
    return `<b>Up next:</b> ${linesLabel(nx.l)} of <code>${esc(nx.fn)}</code>.`;
  }
  function go(i) { cur = Math.max(0, Math.min(N - 1, i)); toast(''); render(); }

  function render() {
    const s = steps[cur];
    for (const el of lit) el.classList.remove('cur', 'wait');
    lit = [];
    let html;
    if (s.k === 'intro') html = viewIntro();
    else if (s.k === 'end') html = viewEnd();
    else {
      for (const [, a, b] of s.st || []) if (a) light(a, b, 'wait');
      light(s.l[0], s.l[1], 'cur');
      html = s.k === 'line' ? viewLine(s) : s.k === 'call' ? viewCall(s) : s.k === 'return' ? viewReturn(s) : viewNote(s);
    }
    const state = $('state');
    state.innerHTML = html;
    state.scrollTop = 0;
    const det = state.querySelector('details.allvars');
    if (det) det.addEventListener('toggle', () => { allOpen = det.open; });
    if (s.l) scrollToLine(s.l[0]); else if (s.k === 'intro') $('code-pane').scrollTop = 0;
    $('counter').textContent = `step ${cur} of ${N - 1}`;
    $('btn-back').disabled = cur === 0;
    $('btn-next').disabled = cur === N - 1;
    $('btn-skip').disabled = skipIdx(cur) < 0;
    $('btn-finish').disabled = finishIdx(cur) < 0;
    $('upnext').innerHTML = upNext(cur);
    scrub.value = String(cur);
    let m = marks[0];
    for (const x of marks) if (x <= cur) m = x;
    jump.value = String(m);
  }

  $('btn-next').addEventListener('click', () => go(cur + 1));
  $('btn-back').addEventListener('click', () => go(cur - 1));
  $('btn-skip').addEventListener('click', () => { const j = skipIdx(cur); if (j >= 0) go(j); });
  $('btn-finish').addEventListener('click', () => { const j = finishIdx(cur); if (j >= 0) go(j); });
  scrub.addEventListener('input', () => go(Number(scrub.value)));
  jump.addEventListener('change', () => go(Number(jump.value)));
  $('src').addEventListener('click', (e) => {
    const b = e.target.closest('.no');
    if (!b) return;
    const n = Number(b.dataset.line);
    const hit = (j) => steps[j].k === 'line' && steps[j].l[0] <= n && n <= steps[j].l[1];
    for (let j = cur + 1; j < N; j++) if (hit(j)) return go(j);
    for (let j = 1; j < cur; j++) if (hit(j)) return go(j);
    toast(`No step stops at line ${n}: it never ran, or it ran only inside a call or loop shown in one go.`);
  });
  document.addEventListener('keydown', (e) => {
    if (e.target.closest && e.target.closest('select, input, textarea')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); go(cur + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); go(cur - 1); }
  });
  render();
})();
</script>
</body>
</html>
