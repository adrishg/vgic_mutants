project:
  name: NaV1.5 50% ensemble RMSF
  channel: NaV1.5
  project_root: data/Nav1.5
  output_root: outputs/nav15_rmsf

residue_axis:
  start: 1
  end: 1572

model_chain: A

sequence_fastas:
  wt: data/Nav1.5/wt/nav15_wt_6uz0.fasta
  qqq: data/Nav1.5/qqq/nav15_qqq_7fbs.fasta

datasets:
  - name: wt_vanilla
    sequence_condition: wt
    protocol: vanilla
    path: data/Nav1.5/wt/vanilla
  - name: wt_masked_v1_50pct
    sequence_condition: wt
    protocol: masked
    path: data/Nav1.5/wt/masked_v1_50pct/models
  - name: wt_masked_v2_50pct
    sequence_condition: wt
    protocol: masked_v2
    path: data/Nav1.5/wt/masked_v2_50pct/models
  - name: qqq_vanilla
    sequence_condition: qqq
    protocol: vanilla
    path: data/Nav1.5/qqq/vanilla
  - name: qqq_masked_v1_50pct
    sequence_condition: qqq
    protocol: masked
    path: data/Nav1.5/qqq/masked_v1_50pct/models
  - name: qqq_masked_v2_50pct
    sequence_condition: qqq
    protocol: masked_v2
    path: data/Nav1.5/qqq/masked_v2_50pct/models

references:
  anchor_id: 6UZ3
  structures:
    - id: 6UZ3
      state: rat_wt_reference
      relationship: primary_WT_reference
      species: rat
      sequence_condition: wt
      path: data/Nav1.5/experimental/6UZ3.pdb
      chain: A
    - id: 7FBS
      state: rat_IFM_to_QQQ_reference
      relationship: primary_QQQ_reference
      species: rat
      sequence_condition: qqq
      path: data/Nav1.5/experimental/7FBS.pdb
      chain: A
    - id: 8T6L
      state: rat_BTX_B_bound_reference
      relationship: secondary_WT_state_reference
      species: rat
      sequence_condition: wt
      path: data/Nav1.5/experimental/8T6L.pdb
      chain: A
    - id: 7DTC
      state: human_E1784K_reference
      relationship: cross_species_mutant_reference
      species: human
      sequence_condition: wt
      path: data/Nav1.5/experimental/7DTC.pdb
      chain: A
    - id: 8VYJ
      state: human_full_length_class_I
      relationship: cross_species_WT_reference
      species: human
      sequence_condition: wt
      path: data/Nav1.5/experimental/8VYJ.pdb
      chain: A
    - id: 8VYK
      state: human_full_length_class_II
      relationship: cross_species_WT_reference
      species: human
      sequence_condition: wt
      path: data/Nav1.5/experimental/8VYK.pdb
      chain: A

alignment_core:
  name: established_stable_core
  raw_ranges:
    - [132, 282]
    - [359, 426]
    - [505, 665]
    - [690, 749]
    - [870, 1112]
    - [1128, 1164]
    - [1200, 1405]
    - [1429, 1466]
  minimum_matched_ca: 700
  minimum_coverage: 0.75

annotations:
  raw_regions:
    - name: IFM_motif
      raw_start: 1169
      raw_end: 1171

sequence_alignment:
  match_score: 2.0
  mismatch_score: -1.0
  open_gap_score: -10.0
  extend_gap_score: -0.5
  end_gap_score: 0.0

analysis:
  recursive: true
  minimum_residue_coverage: 0.80
  coordinate_dtype: float32
  bootstrap_replicates: 0
  bootstrap_seed: 20260728
